<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { background: transparent !important; margin: 0; }

    @keyframes iconBurst2a {
      0%   { opacity: 0; transform: scale(.15) rotate(-100deg); }
      7%   { opacity: 1; transform: scale(1.3) rotate(14deg); }
      12%  { transform: scale(1) rotate(0deg); }
      62%  { opacity: 1; transform: scale(1) rotate(0deg); }
      68%  { opacity: .5; transform: scale(1.15) rotate(20deg); }
      74%  { opacity: 0; transform: scale(.25) rotate(130deg); }
      100% { opacity: 0; transform: scale(.25) rotate(130deg); }
    }
    @keyframes ringSpin2a { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes particle2a {
      0%, 5%   { opacity: 0; transform: translate(0,0) scale(.4); }
      9%       { opacity: 1; transform: translate(var(--px), var(--py)) scale(1); }
      16%      { opacity: 0; transform: translate(calc(var(--px) * 1.7), calc(var(--py) * 1.7)) scale(.2); }
      70%, 100%{ opacity: 0; transform: translate(0,0) scale(.2); }
    }
    @keyframes textWipe2a {
      0%, 13%  { opacity: 0; clip-path: inset(0 100% 0 0); }
      24%      { opacity: 1; clip-path: inset(0 0 0 0); }
      60%      { opacity: 1; clip-path: inset(0 0 0 0); }
      78%      { opacity: 0; clip-path: inset(0 0 0 100%); }
      100%     { opacity: 0; clip-path: inset(0 0 0 100%); }
    }
    @keyframes scanBar2a {
      0%,18% { opacity: 0; left: -10%; }
      22%    { opacity: 1; left: -10%; }
      27%    { opacity: 1; left: 104%; }
      28%    { opacity: 0; left: 104%; }
      100%   { opacity: 0; }
    }
  </style>
</helmet>

<div style="position:fixed; inset:0; background:transparent;">
  <div data-watermark-root="1" style="position:absolute; right:20px; bottom:20px; display:flex; align-items:center;">
    <div style="position:relative; width:57px; height:57px; margin-right:-21px; z-index:2;">
      <div style="position:absolute; inset:0; border-radius:50%; background:#0d1013; border:1px solid rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; overflow:hidden; animation: iconBurst2a 6s cubic-bezier(.22,1,.36,1) infinite;">
        <div style="position:absolute; inset:0; border-radius:50%; background: conic-gradient(from 0deg, rgba(56,225,255,.9), rgba(56,225,255,0) 60%, rgba(56,225,255,.9)); animation: ringSpin2a 3s linear infinite; -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));"></div>
        <img src="https://hakata-public.s3.ap-northeast-1.amazonaws.com/sattori/sattori-icon.png" style="position:absolute; inset:3px; width:calc(100% - 6px); height:calc(100% - 6px); border-radius:50%; object-fit:cover;" alt="TouhouSattori icon"/>
      </div>
      <div style="position:absolute; top:50%; left:50%; width:5px; height:5px; border-radius:50%; background:#38e1ff; --px:-24px; --py:-21px; animation: particle2a 6s ease-out infinite;"></div>
      <div style="position:absolute; top:50%; left:50%; width:5px; height:5px; border-radius:50%; background:#38e1ff; --px:24px; --py:-18px; animation: particle2a 6s ease-out infinite .04s;"></div>
      <div style="position:absolute; top:50%; left:50%; width:5px; height:5px; border-radius:50%; background:#38e1ff; --px:21px; --py:24px; animation: particle2a 6s ease-out infinite .08s;"></div>
      <div style="position:absolute; top:50%; left:50%; width:5px; height:5px; border-radius:50%; background:#38e1ff; --px:-21px; --py:21px; animation: particle2a 6s ease-out infinite .02s;"></div>
    </div>

    <div style="position:relative; padding:12px 20px 12px 26px; border-radius:0 999px 999px 0; overflow:hidden;
        background:rgba(10,12,16,.58); backdrop-filter: blur(10px) saturate(140%); -webkit-backdrop-filter: blur(10px) saturate(140%);
        border:1px solid rgba(255,255,255,.08);
        animation: textWipe2a 6s ease-out infinite;">
      <div style="position:absolute; top:0; bottom:0; width:14%; background:linear-gradient(90deg, transparent, rgba(56,225,255,.3), transparent); animation: scanBar2a 6s linear infinite; pointer-events:none;"></div>
      <div style="display:flex; flex-direction:column; line-height:1.2;">
        <span style="font-family:'Nunito',sans-serif; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#8fe9ff;">Recorded by</span>
        <img src="https://hakata-public.s3.ap-northeast-1.amazonaws.com/sattori/sattori-logo2.svg" style="height:24px; width:auto; display:block; margin:3px 0;" alt="TouhouSattori"/>
        <span style="font-family:'Nunito',sans-serif; font-size:10.5px; font-weight:600; letter-spacing:.02em; color:#7f8b9a;">Touhou Replay Recording Service</span>
      </div>
    </div>
  </div>
</div>

</x-dc>
</body>
</html>
