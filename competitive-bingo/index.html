<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競技ビンゴ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #09091a;
      --surf:     #13132a;
      --surf2:    #1c1c38;
      --surf3:    #252548;
      --gold:     #f5c842;
      --gold-dim: #a38820;
      --pink:     #e84393;
      --blue:     #3b82f6;
      --green:    #22c55e;
      --red:      #ef4444;
      --orange:   #f97316;
      --purple:   #8b5cf6;
      --text:     #f0f0f8;
      --text-dim: #7070a0;
      --border:   #2a2a55;
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 28px 20px 14px;
    }
    header h1 {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 8px;
      background: linear-gradient(135deg, var(--gold) 30%, var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Bingo Card ─────────────────────────────────────── */
    .bingo-card {
      display: inline-grid;
      grid-template-columns: repeat(5, var(--cs, 58px));
      grid-template-rows: var(--hh, 38px) repeat(5, var(--cs, 58px));
      gap: var(--gap, 4px);
      background: var(--surf);
      padding: 10px;
      border-radius: 14px;
      border: 2px solid var(--border);
    }

    .bingo-card .col-hdr {
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.1em;
    }
    .bingo-card .col-hdr:nth-child(1) { color: #60a5fa; }
    .bingo-card .col-hdr:nth-child(2) { color: #f87171; }
    .bingo-card .col-hdr:nth-child(3) { color: #fb923c; }
    .bingo-card .col-hdr:nth-child(4) { color: #4ade80; }
    .bingo-card .col-hdr:nth-child(5) { color: #a78bfa; }

    .bingo-card .cell {
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px; font-weight: 700; font-size: 1em;
      background: var(--surf3);
      transition: background .2s, box-shadow .2s;
      user-select: none;
    }
    .bingo-card .cell.free    { background: var(--purple); color: white; font-size: .65em; letter-spacing: 1px; }
    .bingo-card .cell.manual  { background: var(--orange); color: white; box-shadow: inset 0 0 8px rgba(249,115,22,.4); }
    .bingo-card .cell.marked  { background: var(--blue);   color: white; box-shadow: inset 0 0 8px rgba(59,130,246,.4); }
    .bingo-card .cell.bingo-cell { background: var(--green); color: white; box-shadow: 0 0 14px rgba(34,197,94,.6); }
    .bingo-card .cell.manual-wrong { background: #7c2d12; color: #fca472; border: 2px solid var(--orange); }

    .bingo-card .cell.clickable { cursor: pointer; }
    .bingo-card .cell.clickable:hover:not(.free) { filter: brightness(1.25); }

    /* ── Select Phase ───────────────────────────────────── */
    #select-phase {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px 48px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-dim);
      font-size: 1.05rem;
      margin-bottom: 28px;
    }

    .cards-grid {
      display: flex; flex-wrap: wrap; gap: 20px;
      justify-content: center; margin-bottom: 36px;
    }

    .card-option {
      cursor: pointer; padding: 7px;
      border-radius: 18px; border: 3px solid transparent;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .card-option:hover { transform: translateY(-5px); border-color: var(--gold-dim); }
    .card-option.selected {
      border-color: var(--gold); box-shadow: 0 0 28px rgba(245,200,66,.35);
      transform: translateY(-5px);
    }

    .card-label {
      text-align: center; color: var(--text-dim); font-size: .78rem;
      font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px;
    }

    .center-wrap { display: flex; justify-content: center; }

    /* ── Settings Panel ─────────────────────────────────── */
    .settings-panel {
      max-width: 520px;
      margin: 0 auto 36px;
      background: var(--surf);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 20px 28px;
    }
    .settings-title {
      font-size: .72rem; font-weight: 700; letter-spacing: 3px;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 18px;
    }
    .setting-row {
      display: flex; align-items: center;
      justify-content: space-between; gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-label {
      font-size: .95rem; font-weight: 600; color: var(--text); flex: 1;
    }
    .setting-hint { font-size: .75rem; color: var(--text-dim); }
    .setting-right { display: flex; align-items: center; gap: 10px; }

    .setting-input {
      width: 80px; padding: 6px 10px;
      background: var(--surf3); border: 2px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-size: 1rem; font-weight: 700; text-align: center;
      -moz-appearance: textfield;
    }
    .setting-input::-webkit-inner-spin-button,
    .setting-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .setting-input:focus { outline: none; border-color: var(--gold-dim); }

    .toggle-pair {
      display: flex; background: var(--surf3); border-radius: 8px; padding: 3px; gap: 3px;
    }
    .toggle-btn {
      padding: 5px 16px; border: none; border-radius: 6px; font-size: .88rem;
      font-weight: 700; cursor: pointer; background: transparent; color: var(--text-dim);
      transition: background .15s, color .15s;
    }
    .toggle-btn.active { background: var(--gold); color: #180a00; }

    /* ── Game Phase ─────────────────────────────────────── */
    #game-phase {
      display: flex; gap: 28px; max-width: 1100px;
      margin: 0 auto; padding: 0 20px 48px; align-items: flex-start;
    }
    .game-left { flex-shrink: 0; }
    .game-right {
      flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0;
    }

    .timer-box {
      background: var(--surf); border-radius: 12px; padding: 12px 20px;
      font-family: 'Courier New', monospace; font-size: 2.8rem; font-weight: 900;
      color: var(--gold); text-align: center; letter-spacing: 4px;
    }

    .ball-row {
      display: flex; align-items: center; gap: 20px;
      background: var(--surf); border-radius: 12px; padding: 16px 24px;
    }
    .ball {
      width: 88px; height: 88px; border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, rgba(255,255,255,.35) 0%, transparent 55%),
        linear-gradient(135deg, var(--gold), var(--pink));
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; font-weight: 900; color: white;
      text-shadow: 0 2px 5px rgba(0,0,0,.5); flex-shrink: 0;
    }
    .ball.pop { animation: pop .3s ease; }
    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.22); }
      100% { transform: scale(1); }
    }
    .ball-meta { flex: 1; }
    .ball-label { font-size: .78rem; color: var(--text-dim); margin-bottom: 4px; }
    .ball-count { font-size: .98rem; color: var(--text); }

    .num-scroll-box {
      background: var(--surf); border-radius: 12px; padding: 14px 16px;
    }
    .num-scroll-title {
      font-size: .72rem; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px;
    }
    .num-flow {
      display: flex; flex-wrap: wrap; gap: 6px;
      max-height: 200px; overflow-y: auto;
    }
    .num-flow::-webkit-scrollbar { width: 4px; }
    .num-flow::-webkit-scrollbar-track { background: transparent; }
    .num-flow::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .nbadge { padding: 3px 10px; border-radius: 6px; font-size: .86rem; font-weight: 700; }
    .nbadge.latest { background: var(--gold); color: #120800; }
    .nbadge.old    { background: var(--surf3); color: var(--text-dim); }

    .manual-hint {
      font-size: .78rem; color: var(--orange); text-align: center; padding: 6px 0;
      opacity: .85;
    }

    .declare-btn {
      padding: 18px; border: none; border-radius: 14px;
      font-size: 1.65rem; font-weight: 900; letter-spacing: 3px; cursor: pointer;
      background: linear-gradient(135deg, var(--red), #b91c1c); color: white;
      text-shadow: 0 2px 6px rgba(0,0,0,.4); box-shadow: 0 4px 22px rgba(239,68,68,.4);
      transition: transform .12s, box-shadow .12s;
    }
    .declare-btn:hover  { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(239,68,68,.55); }
    .declare-btn:active { transform: translateY(0); }

    /* ── Result Phase ────────────────────────────────────── */
    #result-phase {
      max-width: 860px; margin: 0 auto; padding: 0 20px 60px;
      display: flex; flex-direction: column; align-items: center; gap: 24px;
    }

    .result-title {
      font-size: 3.5rem; font-weight: 900; text-align: center;
    }
    .result-title.win  { color: var(--green); text-shadow: 0 0 40px rgba(34,197,94,.4); }
    .result-title.lose { color: var(--red);   text-shadow: 0 0 40px rgba(239,68,68,.4); }

    .result-stats-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; width: 100%;
    }
    .stat-box {
      background: var(--surf); border-radius: 12px; padding: 16px 20px;
      border: 2px solid var(--border);
    }
    .stat-box.full { grid-column: 1 / -1; }
    .stat-box.highlight { border-color: var(--gold); }
    .stat-title { font-size: .72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
    .stat-value {
      font-size: 1.8rem; font-weight: 900;
      font-family: 'Courier New', monospace; color: var(--gold); letter-spacing: 2px;
    }
    .stat-value.small { font-size: 1rem; font-family: inherit; color: var(--text); letter-spacing: 0; }
    .stat-sub { font-size: .8rem; color: var(--text-dim); margin-top: 4px; }

    /* called numbers list in result */
    .called-list-box {
      background: var(--surf); border-radius: 12px; padding: 16px 20px; width: 100%;
      border: 2px solid var(--border);
    }
    .called-list-title { font-size: .72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
    .called-list-hint  { font-size: .75rem; color: var(--text-dim); margin-bottom: 10px; }
    .cn-grid {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .cn-item {
      display: flex; flex-direction: column; align-items: center;
      background: var(--surf3); border-radius: 7px; padding: 4px 8px; min-width: 36px;
    }
    .cn-item.on-card { background: #1e3a5f; border: 1px solid #3b82f6; }
    .cn-item.on-card.bingo-num { background: #14472a; border-color: var(--green); }
    .cn-order { font-size: .6rem; color: var(--text-dim); line-height: 1; margin-bottom: 2px; }
    .cn-num   { font-size: .9rem; font-weight: 700; line-height: 1.2; }
    .cn-item.on-card .cn-num { color: #93c5fd; }
    .cn-item.on-card.bingo-num .cn-num { color: #86efac; }

    .result-card-wrap { }

    .mark-accuracy {
      font-size: .92rem; color: var(--text-dim); text-align: center;
      background: var(--surf); border-radius: 10px; padding: 10px 20px;
      border: 2px solid var(--border);
    }
    .mark-accuracy span { font-weight: 700; }
    .mark-accuracy .ok  { color: var(--green); }
    .mark-accuracy .ng  { color: var(--red); }

    .result-sub { color: var(--text-dim); font-size: 1.05rem; text-align: center; }

    /* ── Shared Buttons ─────────────────────────────────── */
    .btn {
      padding: 12px 36px; border: none; border-radius: 10px;
      font-size: 1.05rem; font-weight: 700; cursor: pointer;
      transition: transform .15s, box-shadow .15s, opacity .15s;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); }
    .btn:disabled { opacity: .38; cursor: not-allowed; }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold), #d97706);
      color: #180a00; font-size: 1.2rem; padding: 14px 52px;
    }
    .btn-gold:hover:not(:disabled) { box-shadow: 0 6px 22px rgba(245,200,66,.35); }

    .btn-outline {
      background: transparent; border: 2px solid var(--border); color: var(--text);
    }
    .btn-outline:hover { border-color: var(--text-dim); }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 800px) {
      #game-phase { flex-direction: column; align-items: center; }
      .game-right { width: 100%; }
      header h1  { font-size: 2rem; letter-spacing: 4px; }
      .result-stats-grid { grid-template-columns: 1fr; }
      .stat-box.full { grid-column: 1; }
    }
  </style>
</head>
<body>
  <header><h1>競技ビンゴ</h1></header>
  <main id="root"></main>

  <script>
  'use strict';

  /* ── Constants ────────────────────────────────────────────── */
  const COL_LETTERS = ['B','I','N','G','O'];
  const COL_RANGES  = [[1,15],[16,30],[31,45],[46,60],[61,75]];
  const NUM_CARDS   = 5;

  /* ── Persistent settings (survive resets) ─────────────────── */
  let speechRate     = 1.0;   // SpeechSynthesisUtterance.rate (0.5 – 3.0)
  let postDelaySec   = 0.35;  // seconds between end-of-speech and next number
  let manualHighlight = false; // whether cells are clickable for manual marks

  /* ── State ────────────────────────────────────────────────── */
  let G = mkState();

  function mkState() {
    return {
      phase:        'select',  // 'select' | 'game' | 'result'
      cards:        [],
      selectedIdx:  -1,
      calledSet:    new Set(),
      calledArr:    [],        // newest-first (for live scroll display)
      calledHistory:[],        // [{num, timeMs}] oldest-first
      shuffled:     [],
      numIdx:       0,
      startMs:      0,
      elapsedMs:    0,
      timerHandle:  null,
      nextHandle:   null,
      manualMarks:  new Set(), // r*5+c keys toggled by player
      firstBingoAt: null,      // {numIdx, timeMs} when bingo first became possible
    };
  }

  /* ── Utilities ────────────────────────────────────────────── */
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }
  function range(a, b) { const r=[]; for(let i=a;i<=b;i++) r.push(i); return r; }
  function pickN(a, b, n) { const p=range(a,b); shuffle(p); return p.slice(0,n); }

  function fmtMs(ms) {
    const s=Math.floor(ms/1000), min=Math.floor(s/60), sec=s%60, ms3=Math.floor(ms%1000);
    return `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(ms3).padStart(3,'0')}`;
  }
  function fmtDelta(ms) {
    const s = (ms / 1000).toFixed(3);
    return ms >= 0 ? `+${s}秒` : `${s}秒`;
  }

  /* ── Card logic ───────────────────────────────────────────── */
  function makeCard() {
    const cols = COL_RANGES.map(([a,b]) => pickN(a,b,5));
    const card = Array.from({length:5}, (_,r) => cols.map(c=>c[r]));
    card[2][2] = null; // FREE
    return card;
  }
  function isFree(r,c) { return r===2 && c===2; }
  function isMarked(card,r,c) { return isFree(r,c) || G.calledSet.has(card[r][c]); }

  function getBingoCells(card) {
    const out = new Set();
    const mark = (r,c) => out.add(r*5+c);
    const all  = cells => cells.every(([r,c]) => isMarked(card,r,c));
    for (let r=0;r<5;r++) { const row=[[r,0],[r,1],[r,2],[r,3],[r,4]]; if(all(row)) row.forEach(([r,c])=>mark(r,c)); }
    for (let c=0;c<5;c++) { const col=[[0,c],[1,c],[2,c],[3,c],[4,c]]; if(all(col)) col.forEach(([r,c])=>mark(r,c)); }
    const d1=[[0,0],[1,1],[2,2],[3,3],[4,4]]; if(all(d1)) d1.forEach(([r,c])=>mark(r,c));
    const d2=[[0,4],[1,3],[2,2],[3,1],[4,0]]; if(all(d2)) d2.forEach(([r,c])=>mark(r,c));
    return out;
  }
  function hasBingo(card) { return getBingoCells(card).size > 0; }

  /* ── Speech ───────────────────────────────────────────────── */
  function speakNum(num, onDone) {
    if (!window.speechSynthesis) { setTimeout(onDone, 700); return; }
    const u = new SpeechSynthesisUtterance(String(num));
    u.lang    = 'ja-JP';
    u.rate    = Math.max(0.1, Math.min(10, speechRate));
    u.volume  = 1;
    u.onend   = onDone;
    u.onerror = onDone;
    const voices = speechSynthesis.getVoices();
    const jaVoice = voices.find(v => v.lang.startsWith('ja'));
    if (jaVoice) u.voice = jaVoice;
    speechSynthesis.speak(u);
  }
  function stopSpeech() { window.speechSynthesis && speechSynthesis.cancel(); }

  /* ── Card renderer ────────────────────────────────────────── */
  // opts: { small, bingoCells, showMarks, clickable, manualMarks }
  function cardHtml(card, opts = {}) {
    const { small=false, bingoCells=null, showMarks=false,
            clickable=false, manualMarks=null } = opts;
    const cs=small?43:58, hh=small?30:38, gap=small?3:4, fs=small?'.82em':'1em';
    let h = `<div class="bingo-card" style="--cs:${cs}px;--hh:${hh}px;--gap:${gap}px">`;
    COL_LETTERS.forEach(l => h += `<div class="col-hdr">${l}</div>`);
    for (let r=0;r<5;r++) {
      for (let c=0;c<5;c++) {
        const free   = isFree(r,c);
        const bc     = bingoCells && bingoCells.has(r*5+c);
        const mrkd   = showMarks && !free && G.calledSet.has(card[r][c]);
        const manual = !free && manualMarks && manualMarks.has(r*5+c);
        // manual-wrong = manually marked but was NOT actually called (only meaningful in result)
        const manualWrong = showMarks && manual && !G.calledSet.has(card[r][c]);

        let cls = 'cell';
        if (free)         cls += ' free';
        else if (bc)      cls += ' bingo-cell';
        else if (mrkd)    cls += ' marked';
        else if (manualWrong) cls += ' manual-wrong';
        else if (manual)  cls += ' manual';

        if (clickable && !free) cls += ' clickable';

        const onclick = (clickable && !free) ? ` onclick="toggleCell(${r},${c})"` : '';
        const val = free ? 'FREE' : card[r][c];
        h += `<div class="${cls}" style="font-size:${fs}"${onclick}>${val}</div>`;
      }
    }
    h += '</div>';
    return h;
  }

  /* ── Select phase ─────────────────────────────────────────── */
  function renderSelect() {
    document.getElementById('root').innerHTML = `
      <div id="select-phase">
        <p class="subtitle">5枚のカードから1枚を選んでゲームを開始してください</p>
        <div class="cards-grid">
          ${G.cards.map((card,i) => `
            <div class="card-option${i===G.selectedIdx?' selected':''}"
                 id="co${i}" onclick="pickCard(${i})">
              <div class="card-label">カード ${i+1}</div>
              ${cardHtml(card, {small:true})}
            </div>
          `).join('')}
        </div>

        <div class="settings-panel">
          <div class="settings-title">設定</div>

          <div class="setting-row">
            <div>
              <div class="setting-label">読み上げ速度</div>
              <div class="setting-hint">音声の読み上げ速度 (0.1 〜 10)</div>
            </div>
            <div class="setting-right">
              <input class="setting-input" type="number" id="speechRateInput"
                     min="0.1" max="10" step="0.1" value="${speechRate}"
                     oninput="setSpeechRate(this.value)">
            </div>
          </div>

          <div class="setting-row">
            <div>
              <div class="setting-label">読み上げ間隔</div>
              <div class="setting-hint">読み上げ後の待機時間 (0 〜 10 秒)</div>
            </div>
            <div class="setting-right">
              <input class="setting-input" type="number" id="postDelayInput"
                     min="0" max="10" step="0.05" value="${postDelaySec}"
                     oninput="setPostDelay(this.value)">
              <span class="setting-hint">秒</span>
            </div>
          </div>

          <div class="setting-row">
            <div>
              <div class="setting-label">手動ハイライト</div>
              <div class="setting-hint">カードのマス目をクリックして手動でマーク</div>
            </div>
            <div class="setting-right">
              <div class="toggle-pair">
                <button class="toggle-btn${!manualHighlight?' active':''}"
                        onclick="setManualHighlight(false)">オフ</button>
                <button class="toggle-btn${manualHighlight?' active':''}"
                        onclick="setManualHighlight(true)">オン</button>
              </div>
            </div>
          </div>
        </div>

        <div class="center-wrap">
          <button class="btn btn-gold" id="startBtn"
                  ${G.selectedIdx<0?'disabled':''} onclick="startGame()">
            ゲームスタート ▶
          </button>
        </div>
      </div>`;
  }

  function pickCard(i) {
    G.selectedIdx = i;
    document.querySelectorAll('.card-option').forEach((el,j) =>
      el.classList.toggle('selected', j===i));
    document.getElementById('startBtn').disabled = false;
  }

  function setSpeechRate(v) {
    const n = parseFloat(v);
    if (!isNaN(n) && n >= 0.1) speechRate = n;
  }
  function setPostDelay(v) {
    const n = parseFloat(v);
    if (!isNaN(n) && n >= 0) postDelaySec = n;
  }
  function setManualHighlight(on) {
    manualHighlight = on;
    document.querySelectorAll('.toggle-btn').forEach((el,i) =>
      el.classList.toggle('active', on ? i===1 : i===0));
  }

  /* ── Game phase ───────────────────────────────────────────── */
  function renderGame() {
    const card = G.cards[G.selectedIdx];
    const cardOpts = manualHighlight
      ? {clickable:true, manualMarks:G.manualMarks}
      : {};
    document.getElementById('root').innerHTML = `
      <div id="game-phase">
        <div class="game-left" id="gcWrap">${cardHtml(card, cardOpts)}</div>
        <div class="game-right">
          <div class="timer-box" id="timerEl">00:00.000</div>
          <div class="ball-row">
            <div class="ball" id="ballEl">—</div>
            <div class="ball-meta">
              <div class="ball-label">現在の番号</div>
              <div class="ball-count" id="cntEl">0 / 75</div>
            </div>
          </div>
          <div class="num-scroll-box">
            <div class="num-scroll-title">読み上げ済みの番号</div>
            <div class="num-flow" id="numFlow"></div>
          </div>
          ${manualHighlight ? '<div class="manual-hint">マス目をクリックして手動マーク（オレンジ）</div>' : ''}
          <button class="declare-btn" onclick="declareBingo()">ビンゴ申告！</button>
        </div>
      </div>`;
  }

  function toggleCell(r, c) {
    if (!manualHighlight || G.phase !== 'game' || isFree(r,c)) return;
    const key = r*5+c;
    if (G.manualMarks.has(key)) G.manualMarks.delete(key);
    else G.manualMarks.add(key);
    const wrap = document.getElementById('gcWrap');
    const card = G.cards[G.selectedIdx];
    if (wrap) wrap.innerHTML = cardHtml(card, {clickable:true, manualMarks:G.manualMarks});
  }

  function updateGameUI(newNum) {
    const ball = document.getElementById('ballEl');
    if (ball) {
      ball.textContent = newNum;
      ball.classList.remove('pop');
      void ball.offsetWidth;
      ball.classList.add('pop');
    }
    const cnt = document.getElementById('cntEl');
    if (cnt) cnt.textContent = `${G.numIdx} / 75`;
    const flow = document.getElementById('numFlow');
    if (flow) {
      flow.innerHTML = G.calledArr
        .map((n,i) => `<span class="nbadge ${i===0?'latest':'old'}">${n}</span>`)
        .join('');
    }
  }

  function startGame() {
    if (G.selectedIdx < 0) return;
    G.calledSet    = new Set();
    G.calledArr    = [];
    G.calledHistory = [];
    G.manualMarks  = new Set();
    G.firstBingoAt = null;
    const nums = range(1,75); shuffle(nums);
    G.shuffled = nums; G.numIdx = 0;
    G.phase   = 'game';
    G.startMs = performance.now();

    G.timerHandle = setInterval(() => {
      G.elapsedMs = performance.now() - G.startMs;
      const el = document.getElementById('timerEl');
      if (el) el.textContent = fmtMs(G.elapsedMs);
    }, 33);

    renderGame();
    callNext();
  }

  function callNext() {
    if (G.phase !== 'game') return;
    if (G.numIdx >= G.shuffled.length) return;

    const num    = G.shuffled[G.numIdx++];
    const timeMs = performance.now() - G.startMs;
    G.calledSet.add(num);
    G.calledArr.unshift(num);
    G.calledHistory.push({num, timeMs});

    // track first bingo moment
    if (G.firstBingoAt === null) {
      const card = G.cards[G.selectedIdx];
      if (hasBingo(card)) {
        G.firstBingoAt = {numIdx: G.numIdx, timeMs};
      }
    }

    updateGameUI(num);
    speakNum(num, () => {
      if (G.phase === 'game') {
        G.nextHandle = setTimeout(callNext, Math.round(postDelaySec * 1000));
      }
    });
  }

  function declareBingo() {
    if (G.phase !== 'game') return;
    const elapsed = performance.now() - G.startMs;
    clearInterval(G.timerHandle);
    clearTimeout(G.nextHandle);
    stopSpeech();
    G.phase = 'result';
    const card = G.cards[G.selectedIdx];
    renderResult(hasBingo(card), elapsed);
  }

  /* ── Result phase ─────────────────────────────────────────── */
  function renderResult(won, elapsedMs) {
    const card    = G.cards[G.selectedIdx];
    const bcs     = won ? getBingoCells(card) : null;
    const numCount = G.calledHistory.length;

    // ── Stat boxes ──
    let statsHtml = '';

    if (won) {
      statsHtml += `
        <div class="stat-box highlight">
          <div class="stat-title">申告タイム</div>
          <div class="stat-value">${fmtMs(elapsedMs)}</div>
        </div>`;

      if (G.firstBingoAt) {
        const delta = elapsedMs - G.firstBingoAt.timeMs;
        statsHtml += `
          <div class="stat-box">
            <div class="stat-title">最初のビンゴ成立</div>
            <div class="stat-value">${fmtMs(G.firstBingoAt.timeMs)}</div>
            <div class="stat-sub">${G.firstBingoAt.numIdx}番目の数字で成立 / 申告は ${fmtDelta(delta)}</div>
          </div>`;
      }
    } else {
      statsHtml += `
        <div class="stat-box highlight" style="border-color:var(--red)">
          <div class="stat-title">申告タイム</div>
          <div class="stat-value" style="color:var(--red)">${fmtMs(elapsedMs)}</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">最初のビンゴ成立</div>
          <div class="stat-value small">まだ成立していませんでした</div>
        </div>`;
    }

    statsHtml += `
      <div class="stat-box">
        <div class="stat-title">読み上げ数</div>
        <div class="stat-value">${numCount}<span style="font-size:1rem;font-family:inherit;color:var(--text-dim)"> / 75</span></div>
      </div>`;

    // ── Manual mark accuracy (only if mode was on) ──
    let manualAccHtml = '';
    if (manualHighlight && G.manualMarks.size > 0) {
      let correct=0, wrong=0;
      G.manualMarks.forEach(key => {
        const r=Math.floor(key/5), c=key%5;
        if (!isFree(r,c)) {
          const num = card[r][c];
          if (G.calledSet.has(num)) correct++; else wrong++;
        }
      });
      manualAccHtml = `
        <div class="mark-accuracy">
          手動マーク精度 ―
          <span class="ok">正解 ${correct}個</span>・<span class="ng">誤マーク ${wrong}個</span>
          (合計 ${correct+wrong}個マーク)
        </div>`;
    }

    // ── Called numbers list ──
    // Build a set of numbers on the player's card for highlighting
    const cardNums = new Set();
    for (let r=0;r<5;r++) for (let c=0;c<5;c++) if (!isFree(r,c)) cardNums.add(card[r][c]);

    const cnItems = G.calledHistory.map(({num}, idx) => {
      const onCard  = cardNums.has(num);
      const isBingo = bcs && onCard && (() => {
        // check if this number contributes to a bingo line
        for (let r=0;r<5;r++) for (let c=0;c<5;c++)
          if (card[r][c]===num && bcs.has(r*5+c)) return true;
        return false;
      })();
      const cls = 'cn-item' + (onCard ? (isBingo ? ' on-card bingo-num' : ' on-card') : '');
      return `<div class="${cls}"><span class="cn-order">${idx+1}</span><span class="cn-num">${num}</span></div>`;
    }).join('');

    const cnLegend = won
      ? '<span style="color:#86efac">■</span> ビンゴライン&nbsp;&nbsp;<span style="color:#93c5fd">■</span> カードにある数字&nbsp;&nbsp;<span style="color:var(--text-dim)">■</span> カードにない数字'
      : '<span style="color:#93c5fd">■</span> カードにある数字&nbsp;&nbsp;<span style="color:var(--text-dim)">■</span> カードにない数字';

    document.getElementById('root').innerHTML = `
      <div id="result-phase">
        <div class="result-title ${won?'win':'lose'}">${won?'🎉 ビンゴ！':'💀 失格！'}</div>

        <div class="result-stats-grid" style="width:100%">
          ${statsHtml}
        </div>

        <div class="called-list-box">
          <div class="called-list-title">読み上げた数字（${numCount}個）</div>
          <div class="called-list-hint">${cnLegend}</div>
          <div class="cn-grid">${cnItems}</div>
        </div>

        <div class="result-card-wrap">
          ${cardHtml(card, {bingoCells:bcs, showMarks:true,
              manualMarks: manualHighlight ? G.manualMarks : null})}
        </div>

        ${manualAccHtml}

        <button class="btn btn-outline" onclick="init()">もう一度プレイ</button>
      </div>`;
  }

  /* ── Init ─────────────────────────────────────────────────── */
  function init() {
    stopSpeech();
    G = mkState();
    G.cards = Array.from({length: NUM_CARDS}, makeCard);
    renderSelect();
  }

  // Warm up voices on first load (Chrome loads them asynchronously)
  if (window.speechSynthesis) {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }

  init();
  </script>
</body>
</html>
